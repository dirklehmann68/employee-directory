<f:if condition="({employee.phone} && ({showPhone} || !{showPhoneDefined})) || ({employee.email} && ({showEmail} || !{showEmailDefined}))">
    <div class="employee-contact-wrap">

        <f:if condition="{employee.phone} && ({showPhone} || !{showPhoneDefined})">
            <div class="employee-contact employee-contact-phone">
                <span class="employee-contact-label">
                    {labelPhone}
                </span>
                <a
                    href="tel:{employee.phone}"
                    class="employee-contact-link employee-contact-link-phone badge text-bg-light border"
                    aria-label="{labelCall} {employee.phone}"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        class="employee-contact-icon"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M6.6 3.5 9.1 7.8 7.4 9.5 C8.6 12.1 10.8 14.3 13.5 15.6 L15.2 13.9 19.5 16.4 C20.1 16.8 20.3 17.5 20 18.1 C19.4 19.4 18 20.5 16.5 20.5 C10.1 20.5 3.5 13.9 3.5 7.5 C3.5 6 4.6 4.6 5.9 3.8 C6.1 3.7 6.4 3.6 6.6 3.5Z"/>
                    </svg>
                    <span class="employee-contact-value">{employee.phone}</span>
                </a>
            </div>
        </f:if>

        <f:if condition="{employee.email} && ({showEmail} || !{showEmailDefined})">
            <div class="employee-contact employee-contact-email">
                <span class="employee-contact-label">
                    {labelEmail}
                </span>
                <a
                    href="mailto:{employee.email}"
                    class="employee-contact-link employee-contact-link-email badge text-bg-light border"
                    aria-label="{labelWriteEmail} {employee.email}"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        class="employee-contact-icon"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 6 9-6"/>
                    </svg>
                    <span class="employee-contact-value">{employee.email}</span>
                </a>
            </div>
        </f:if>

    </div>
</f:if>
