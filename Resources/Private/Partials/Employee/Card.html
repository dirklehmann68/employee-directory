<f:variable name="hasCardImage" value="0" />

<f:if condition="{settings.showImage} && {employee.image}">
    <f:variable name="hasCardImage" value="1" />
</f:if>

<f:if condition="{settings.showImage} && {settings.showImagePlaceholder} && !{employee.image}">
    <f:variable name="hasCardImage" value="1" />
</f:if>

<div class="col">
    <div class="card h-100">
        <div class="row g-0 h-100">
            <f:if condition="{hasCardImage}">
                <div class="col-sm-3 p-3">
                    <f:if condition="{employee.image} && {settings.showImage}">
                        <f:then>
                            <f:image
                                image="{employee.image}"
                                class="img-fluid rounded"
                                width="125c"
                                height="125c"
                                alt="{employee.title} {employee.firstName} {employee.lastName}"
                            />
                        </f:then>
                        <f:else>
                            <f:if condition="{settings.showImagePlaceholder}">
                                <img
                                    src="{f:uri.resource(path: 'Svg/employee-placeholder.svg', extensionName: 'EmployeeDirectory')}"
                                    class="img-fluid rounded"
                                    width="125"
                                    height="125"
                                    alt=""
                                />
                            </f:if>
                        </f:else>
                    </f:if>
                </div>
            </f:if>
            <div class="{f:if(condition: hasCardImage, then: 'col-sm-9', else: 'col-sm-12')} p-3 d-flex flex-column">
                <h3 class="employee-name" translate="no">
                    <f:render partial="Employee/Name" arguments="{employee: employee}" />
                </h3>

                <f:if condition="{employee.jobFunction} && {settings.showJobFunction}">
                    <p class="employee-job-function">
                        {employee.jobFunction.title}
                    </p>
                </f:if>
                <f:render
                    partial="Employee/Contact"
                    arguments="{
                        employee: employee,
                        labelPhone: labelPhone,
                        labelEmail: labelEmail,
                        labelCall: labelCall,
                        labelWriteEmail: labelWriteEmail,
                        showPhone: settings.showPhone,
                        showPhoneDefined: 1,
                        showEmail: settings.showEmail,
                        showEmailDefined: 1
                    }"
                />
                <f:if condition="({employee.location} && {settings.showLocation}) || ({employee.department} && {settings.showDepartment}) || ({employee.room} && {settings.showRoom})">
                    <div class="employee-meta-wrap">

                        <f:if condition="{employee.department} && {settings.showDepartment}">
                            <div class="employee-meta employee-meta-department">
                                <span class="employee-meta-label">
                                    {labelCardDepartment}
                                </span>
                                <span class="employee-meta-value">
                                    {employee.department.title}
                                </span>
                            </div>
                        </f:if>

                        <f:if condition="{employee.location} && {settings.showLocation}">
                            <div class="employee-meta employee-meta-location">
                                <span class="employee-meta-label">
                                    {labelLocation}
                                </span>
                                <span class="employee-meta-value" translate="no">
                                    {employee.location}
                                </span>
                            </div>
                        </f:if>

                        <f:if condition="{employee.room} && {settings.showRoom}">
                            <div class="employee-meta employee-meta-room">
                                <span class="employee-meta-label">
                                    {labelRoom}
                                </span>
                                <span class="employee-meta-value">
                                    {employee.room}
                                </span>
                            </div>
                        </f:if>
                    </div>
                </f:if>
                <f:if condition="{employee.officeHours} && {settings.showOfficeHours}">
                    <div class="employee-office-hours bg-body-tertiary border rounded p-3 my-3 small">
                        <span class="employee-office-hours-label">
                            {labelOfficeHours}
                        </span>
                        <span class="employee-office-hours-value">
                            <f:format.nl2br>{employee.officeHours}</f:format.nl2br>
                        </span>
                    </div>
                </f:if>
                <f:if condition="{employee.description}">
                    <div class="employee-card-actions mt-auto">
                        <f:if condition="{isStandaloneList}">
                            <f:then>
                                <f:if condition="{settings.detailPageUid} > 0">
                                    <f:link.action
                                        action="show"
                                        extensionName="EmployeeDirectory"
                                        pluginName="EmployeeDetail"
                                        pageUid="{settings.detailPageUid}"
                                        arguments="{employee: employee}"
                                        class="btn btn-secondary btn-sm">
                                        {labelMore}
                                    </f:link.action>
                                </f:if>
                            </f:then>
                            <f:else>
                                <f:link.action
                                    action="show"
                                    arguments="{employee: employee}"
                                    class="btn btn-secondary btn-sm">
                                    {labelMore}
                                </f:link.action>
                            </f:else>
                        </f:if>
                    </div>
                </f:if>
            </div>
        </div>
    </div>
</div>
